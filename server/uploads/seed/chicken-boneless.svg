<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFF3EE"/>
      <stop offset="100%" stop-color="#FCDDD0"/>
    </radialGradient>
    <linearGradient id="meat2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBC9BC"/>
      <stop offset="100%" stop-color="#EF9A87"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)"/>
  <ellipse cx="200" cy="295" rx="120" ry="16" fill="#D9887A" opacity="0.22"/>

  <!-- plate -->
  <ellipse cx="200" cy="235" rx="145" ry="90" fill="#FFFFFF"/>
  <ellipse cx="200" cy="235" rx="145" ry="90" fill="none" stroke="#F0DFD9" stroke-width="6"/>

  <!-- neat boneless cubes stacked -->
  <g stroke="#C97A65" stroke-width="2.5" stroke-linejoin="round">
    <rect x="140" y="205" width="55" height="50" rx="10" fill="url(#meat2)"/>
    <rect x="205" y="195" width="58" height="52" rx="10" fill="url(#meat2)"/>
    <rect x="170" y="245" width="56" height="50" rx="10" fill="url(#meat2)"/>
    <rect x="235" y="235" width="52" height="48" rx="10" fill="url(#meat2)"/>
  </g>
  <g fill="#fff" opacity="0.4">
    <rect x="150" y="212" width="20" height="8" rx="4"/>
    <rect x="215" y="203" width="22" height="8" rx="4"/>
    <rect x="180" y="252" width="20" height="8" rx="4"/>
    <rect x="245" y="242" width="18" height="8" rx="4"/>
  </g>
</svg>
